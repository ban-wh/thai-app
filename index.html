<script>
// ===== Thai App quiz engine (pure functions, no DOM) =====
const LADDER = [1, 3, 7, 14, 30, 60, 120];
const SEEDED_LEVELS = ['Speak L1', 'Speak L2'];
const BLOCK = 15;          // checkpoint / repeat-limit window
const COOLDOWN = 3;        // same card not within last 3 questions
const MAX_PER_BLOCK = 3;

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function dayNum(d) { d = d || new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }
function shuffle(a, rnd) { rnd = rnd || Math.random; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function zhTokens(zh) { return (zh || '').replace(/……|…/g, '').split(/[、；;，,／/（）()\s]+/).map(t => t.trim()).filter(t => t.length > 0); }
function normRt(r) { return (r || '').toLowerCase().replace(/[\s\-]/g, ''); }

// ---------- karaoke (derived from Paiboon, deterministic) ----------
function toKaraoke(pb) {
  if (!pb) return '';
  const s = pb.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  return s.replace(/[a-zɔɛʉə]+/g, x => {
    x = x.replace(/ee/g, 'E').replace(/ooy/g, 'oy').replace(/oo$/, 'oh').replace(/oo/g, 'o');                       // long e first, so ii→ee is not re-touched

let LANG='zh';
function t(k,...a){let s=(I18N[LANG]&&I18N[LANG][k])||I18N.zh[k]||k;a.forEach((v,i)=>{s=s.replace('{'+i+'}',v)});return s}
function topicName(tp){const i=TOPICS.indexOf(tp);return LANG==='en'&&i>=0?TOPICS_EN[i]:tp}
function lvName(l){return LANG==='en'&&l==='日常补充'?'Daily extras':l}
let TH_VOICE=null;function pickVoice(){try{const vs=speechSynthesis.getVoices();TH_VOICE=vs.find(v=>/^th/i.test(v.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(text,ev){if(ev)ev.stopPropagation();try{if(!window.speechSynthesis){voiceHelp(true);return}pickVoice();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='th-TH';if(TH_VOICE)u.voice=TH_VOICE;u.rate=0.8;let started=false;u.onstart=()=>{started=true};u.onerror=e=>{if(!started&&e.error!=='interrupted'&&e.error!=='canceled')voiceHelp()};speechSynthesis.speak(u);setTimeout(()=>{if(!started&&!speechSynthesis.speaking)voiceHelp()},2500)}catch(e){voiceHelp()}}
let voiceHelpShown=false;function voiceHelp(force){if(voiceHelpShown&&!force)return;voiceHelpShown=true;const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="card sheet"><h2 style="margin-top:0">${t('vh_t')}</h2><p class="small">${t('vh_intro')}</p><b>Android</b><ol class="small">${t('vh_and')}</ol><b>iPhone / iPad</b><ol class="small">${t('vh_ios')}</ol><p class="small mute">${t('vh_web')}</p><button class="btn pri" style="width:100%">${t('vh_ok')}</button></div>`;o.querySelector('button').onclick=()=>o.remove();o.onclick=e=>{if(e.target===o)o.remove()};document.body.appendChild(o)}
function cName(c){return c[0]+'อ '+c[2]}
function spk(text){return `<button class="spk" onclick="say('${text.replace(/'/g,'')}',event)" aria-label="play">${ICON_SPK}</button>`}
const ICON_SPK='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a3.5 3.5 0 0 1 0 6M18.5 6.5a7 7 0 0 1 0 11"/></svg>';
function ZH(){return S.meta.settings.showZh===true}
function Z(x){return ZH()?x:''}

const exRow=r=>`<button class="lex" onclick="say('${r[0]}',event)"><span class="spk">${ICON_SPK}</span><span class="th">${esc(r[0])}</span><span class="pb${r[3]!=null?' tn tn'+r[3]:''}">${esc(r[1])}</span>${r[2]?`<span class="en">${esc(r[2])}</span>`:''}</button>`;
const LESSONS=[
 {t:{en:'The Thai writing system',zh:'泰文书写体系'},
  p:[{en:'Thai has 44 consonants, 32 vowel forms and 4 tone marks. It is read left to right, and words are written without spaces.',zh:'泰语有 44 个辅音、32 个元音写法和 4 个声调符号。从左往右读，词与词之间不空格。'},
     {en:'Every syllable starts with a consonant. When a syllable starts with a vowel sound, the silent consonant อ holds its place: อา aa, อิ่ม ìm.',zh:'每个音节都以辅音开头。如果音节听起来以元音开头，就用不发音的 อ 占位：อา aa、อิ่ม ìm。'},
     {en:'Vowels can be written before, after, above, below or around the consonant — but the consonant is always pronounced first. เก is g + ee.',zh:'元音可以写在辅音的前、后、上、下，或者包住辅音——但永远先读辅音。เก 读作 g + ee。'},
     {en:'Consonants belong to three classes: mid, high and low. The class, the vowel length, the final sound and the tone mark together decide the tone (lessons 4–7).',zh:'辅音分成中、高、低三类。辅音类别、元音长短、尾音和声调符号一起决定声调（第 4–7 课）。'}],
  ex:[['before',[['ไป','bpai','go'],['แม่','mɛ̂ɛ','mother'],['โต๊ะ','dtó','table']]],['after',[['ตา','dtaa','eye'],['มา','maa','come']]],['above',[['ดี','dii','good'],['กิน','gin','eat']]],['below',[['ปู','bpuu','crab'],['ดุ','dù','fierce']]],['around',[['เสือ','sʉ̌a','tiger'],['เดือน','dʉan','month']]]],
  q:['pos','init']},
 {t:{en:'Mid class, live & dead syllables',zh:'中辅音、活音节与死音节'},
  p:[{en:'The 9 mid-class consonants are ก จ ด ต ฎ ฏ บ ป อ. They are the easiest class: with no tone mark, a live syllable is mid tone and a dead syllable is low tone.',zh:'中辅音有 9 个：ก จ ด ต ฎ ฏ บ ป อ。它们最简单：没有声调符号时，活音节读中调，死音节读低调。'},
     {en:'LIVE syllable: ends in a long vowel, or in -m, -n, -ng, -y, -w. DEAD syllable: ends in a short vowel, or in -k, -t, -p.',zh:'活音节：以长元音结尾，或以 -m、-n、-ng、-y、-w 结尾。死音节：以短元音结尾，或以 -k、-t、-p 结尾。'},
     {en:'Many letters share the same final sound. At the end of a syllable there are only 6 consonant sounds (plus -y / -w from ย ว):',zh:'很多字母做尾音时读法一样。音节末尾只有 6 种辅音（另有 ย ว 带来的 -y / -w）：'}],
  fin:[['-k','ก ข ค ฆ',['มาก','mâak','very']],['-t','ด ต จ ช ซ ส ศ ษ ฎ ฏ ฐ ฑ ฒ ถ ท ธ',['บาท','bàat','baht']],['-p','บ ป พ ฟ ภ',['ชอบ','chɔ̂ɔp','like']],['-n','น ณ ญ ร ล ฬ',['อาหาร','aa-hǎan','food']],['-m','ม',['สาม','sǎam','three']],['-ng','ง',['บ้าง','bâang','some']]],
  ex:[['live',[['กา','gaa','crow'],['ดิน','din','soil'],['ปาก','bpàak','mouth']]]],
  q:['livedead','final']},
 {t:{en:'Seven vowels that change form',zh:'七个会变形的元音'},
  p:[{en:'When a final consonant follows, these seven vowels are written differently. The sound does not change.',zh:'后面有尾辅音时，这七个元音的写法会改变，但读音不变。'},
     {en:'Tip: a word with two consonants and no vowel at all (คน, จบ) hides a short o.',zh:'提示：只有两个辅音、看不到元音的词（คน、จบ），藏着一个短元音 o。'}],
  vf:[['◌ะ','◌ั◌',['กัด','gàt','bite']],['เ◌ะ','เ◌็◌',['เด็ก','dèk','child']],['แ◌ะ','แ◌็◌',['แข็ง','kɛ̌ng','hard']],['โ◌ะ','◌◌ (hidden)',['คน','kon','person']],['◌ือ','◌ื◌',['จืด','jʉ̀ʉt','bland']],['◌ัว','◌ว◌',['ปวด','bpùat','ache']],['เ◌อ','เ◌ิ◌',['เดิน','dəən','walk']],['เ◌อ + ย','เ◌ย',['เลย','ləəi','at all']]],
  q:['vform']},
 {t:{en:'Tone marks & mid-class tones',zh:'声调符号与中辅音声调'},
  p:[{en:'Thai has 5 tones: mid, low, falling, high and rising. Colours in this course: mid plain, low blue, falling green, high red, rising orange.',zh:'泰语有 5 个声调：中、低、降、高、升。本课程的颜色：中调原色、低调蓝、降调绿、高调红、升调橙。'},
     {en:'There are 4 tone marks, written above the first consonant: ◌่ (mai èek), ◌้ (mai too), ◌๊ (mai dtrii), ◌๋ (mai jàt-dtà-waa).',zh:'4 个声调符号写在第一个辅音上方：◌่（mai èek）、◌้（mai too）、◌๊（mai dtrii）、◌๋（mai jàt-dtà-waa）。'},
     {en:'Mid class is the only class that can take all five tones. No mark: live → mid, dead → low. With a mark: ◌่ low, ◌้ falling, ◌๊ high, ◌๋ rising.',zh:'只有中辅音能有全部五个声调。无符号：活音节 → 中调，死音节 → 低调。有符号：◌่ 低调、◌้ 降调、◌๊ 高调、◌๋ 升调。'}],
  ex:[['tones',[['ปา','bpaa','throw'],['ป่า','bpàa','forest'],['ป้า','bpâa','aunt'],['ก๊าซ','gáat','gas'],['จ๋า','jǎa','(sweet particle)']]]],
  rule:'M',q:['toneM']},
 {t:{en:'High-class consonants',zh:'高辅音'},
  p:[{en:'The 11 high-class consonants are ข ฃ ฉ ฐ ถ ผ ฝ ศ ษ ส ห.',zh:'高辅音有 11 个：ข ฃ ฉ ฐ ถ ผ ฝ ศ ษ ส ห。'},
     {en:'No mark: live → rising, dead → low. With ◌่ → low, with ◌้ → falling. High class never has a mid or high tone, so ◌๊ and ◌๋ are not used.',zh:'无符号：活音节 → 升调，死音节 → 低调。加 ◌่ → 低调，加 ◌้ → 降调。高辅音没有中调和高调，所以不用 ◌๊ ◌๋。'}],
  ex:[['tones',[['ขา','kǎa','leg'],['ผัด','pàt','stir-fry'],['ไข่','kài','egg'],['ข้าว','kâao','rice']]]],
  rule:'H',q:['toneH']},
 {t:{en:'Low-class consonants',zh:'低辅音'},
  p:[{en:'The 24 low-class consonants come in two groups. Paired letters have a high-class twin with the same sound: ค ฅ ฆ ช ซ ฌ ฑ ฒ ท ธ พ ฟ ภ ฮ. Unique letters have no twin: ง ญ ณ น ม ย ร ล ว ฬ.',zh:'低辅音有 24 个，分两组。成对低辅音有一个读音相同的高辅音「双胞胎」：ค ฅ ฆ ช ซ ฌ ฑ ฒ ท ธ พ ฟ ภ ฮ。单一低辅音没有双胞胎：ง ญ ณ น ม ย ร ล ว ฬ。'},
     {en:'No mark: live → mid; dead with a short vowel → high; dead with a long vowel → falling. With ◌่ → falling, with ◌้ → high.',zh:'无符号：活音节 → 中调；死音节 + 短元音 → 高调；死音节 + 长元音 → 降调。加 ◌่ → 降调，加 ◌้ → 高调。'},
     {en:'Tip: the same mark gives a low-class letter a tone one step higher than a high-class letter: ค่า and ข้า are both falling.',zh:'提示：同一个符号，低辅音比高辅音「高一级」：ค่า 和 ข้า 都是降调。'}],
  ex:[['tones',[['คา','kaa','stuck'],['ค่า','kâa','value'],['ค้า','káa','trade'],['นก','nók','bird'],['มาก','mâak','very']]]],
  rule:'L',q:['toneL','class']},
 {t:{en:'Tone rules review',zh:'声调规则总复习'},
  p:[{en:'Everything on one chart. Find the class of the first consonant, check for a tone mark, then decide live or dead.',zh:'所有规则放在一张表里。先找第一个辅音的类别，再看有没有声调符号，最后判断活音节还是死音节。'}],
  chart:true,q:['toneM','toneH','toneL','class','livedead']}
];
// tone produced by the rules: cls M/H/L, live, long, mark 0-4
const RULE_TXT=(it)=>{const c=t('cls_'+CLS_K[it[3]]);if(it[6])return `${c} + ◌◌${['','่','้','๊','๋'][it[6]]} → ${t('tone_'+TONE_K[it[8]])}`;return `${c} + ${it[4]?t('live'):t('dead')+(it[3]==='L'?' + '+(it[5]?t('longV'):t('shortV')):'')} → ${t('tone_'+TONE_K[it[8]])}`};
function lqGen(kind,rnd){
 const pick=a=>a[Math.floor(rnd()*a.length)];
 if(kind==='pos'){const VM=ALPHA.vmeta||{};const ids=Object.keys(VM).filter(k=>['before','after','above','below','around'].includes(VM[k].pos)&&!VM[k].rare);const i=+pick(ids);const v=ALPHA.vowels[i];const pos=VM[i].pos;
  return{prompt:v[0].replace(/อ/,'◌'),say:VM[i].ex&&VM[i].ex[0],sub:VM[i].ex?`${VM[i].ex[0]} · ${VM[i].ex[1]}`:'',ask:t('lq_pos'),opts:['before','after','above','below','around'].map(k=>({k,l:t('pos_'+k)})),ans:pos,exp:VM[i].ex?`${VM[i].ex[0]} ${VM[i].ex[1]} — ${VM[i].ex[2]}`:''}}
 if(kind==='init'){const pool=LBANK.filter(x=>'เแโใไ'.includes(x[0][0]));const it=pick(pool);const c=it[0][1];const others=E.shuffle(ALPHA.consonants.map(x=>x[0]).filter(x=>x!==c&&!it[0].includes(x)&&!(ALPHA.crare||{})[x]),rnd).slice(0,3);
  return{prompt:it[0],say:it[0],sub:'',ask:t('lq_init'),opts:E.shuffle([c,...others],rnd).map(k=>({k,l:k,th:1})),ans:c,exp:`${it[0]} ${it[1]} — ${it[2]}. ${t('lq_initExp',it[0][0],c)}`}}
 if(kind==='livedead'){const it=pick(LBANK.filter(x=>!x[6]));
  return{prompt:it[0],say:it[0],sub:it[1],ask:t('lq_ld'),opts:[{k:1,l:t('live')},{k:0,l:t('dead')}],ans:it[4],exp:`${it[0]} ${it[1]} — ${it[2]}. ${it[4]?(it[7]?t('ld_liveF',it[7]):t('ld_liveV')):(it[7]?t('ld_deadF',it[7]):t('ld_deadV'))}`}}
 if(kind==='final'){const it=pick(LBANK.filter(x=>x[7]));const F=['k','t','p','n','m','ng'];
  return{prompt:it[0],say:it[0],sub:'',ask:t('lq_fin'),opts:F.map(k=>({k,l:'-'+k})),ans:it[7],exp:`${it[0]} ${it[1]} — ${it[2]}`}}
 if(kind==='vform'){const VF={a:'◌ะ',e:'เ◌ะ','ɛ':'แ◌ะ',o:'โ◌ะ','ʉʉ':'◌ือ',ua:'◌ัว','əə':'เ◌อ'};const it=pick(LBANK.filter(x=>VF[x[9]]));const keys=Object.keys(VF);const wrong=E.shuffle(keys.filter(k=>k!==it[9]),rnd).slice(0,3);
  return{prompt:it[0],say:it[0],sub:'',ask:t('lq_vf'),opts:E.shuffle([it[9],...wrong],rnd).map(k=>({k,l:VF[k],th:1})),ans:it[9],exp:`${it[0]} ${it[1]} — ${it[2]}`}}
 if(kind==='class'){const c=pick(ALPHA.consonants.filter(x=>!(ALPHA.crare||{})[x[0]]));const k={'中':'M','高':'H','低':'L'}[c[4]];
  return{prompt:c[0],say:c[0]+' '+c[1],sub:'',ask:t('lq_cls'),opts:['M','H','L'].map(x=>({k:x,l:t('cls_'+CLS_K[x])})),ans:k,exp:`${c[0]} ${c[1]||''} — ${t('cls_'+CLS_K[k])}`}}
 if(kind.startsWith('tone')){const cls=kind.slice(4);const it=pick(LBANK.filter(x=>x[3]===cls));
  return{prompt:it[0],say:it[0],sub:'',ask:t('lq_tone'),opts:[0,1,2,3,4].map(k=>({k,l:tn(k),raw:1})),ans:it[8],exp:`${it[0]} <b>${esc(it[1])}</b> — ${esc(it[2])}<br>${RULE_TXT(it)}`,expRaw:1}}
 return null}
let LQ=null;
function renderLessons(){const L=S.meta.lessons||{};
 app().innerHTML=`<div class="top"><h1>${t('course')}</h1>${langSeg()}</div><p class="mute small">${t('courseHint')}</p>
 ${LESSONS.map((x,i)=>{const b=L[i+1];return `<button class="card lcard" onclick="location.hash='lesson-${i+1}'"><span class="ln">${i+1}</span><span class="grow"><span class="t">${esc(x.t[LANG==='zh'?'zh':'en'])}</span>${LANG==='zh'?`<span class="mute tiny">${esc(x.t.en)}</span>`:''}</span><span class="lb">${b?`${b.best}%`:''}</span></button>`}).join('')}<div style="height:70px"></div>`}
function renderLesson(n){const x=LESSONS[n-1];if(!x){location.hash='lessons';return}const L=(S.meta.lessons||{})[n];
 const zh=LANG==='zh';const P=p=>`<p>${esc(zh?p.zh:p.en)}</p>`;
 let body=x.p.map(P).join('');
 if(x.fin)body+=`<table class="ltab"><tr><th>${t('sound')}</th><th>${t('letters')}</th><th>${t('exWord')}</th></tr>${x.fin.map(r=>`<tr><td><b>${r[0]}</b></td><td class="th">${r[1]}</td><td>${r.slice(2).map(exRow).join('')}</td></tr>`).join('')}</table>`;
 if(x.vf)body+=`<table class="ltab"><tr><th>${t('vfOpen')}</th><th>${t('vfClosed')}</th><th>${t('exWord')}</th></tr>${x.vf.map(r=>`<tr><td class="th">${r[0]}</td><td class="th">${r[1]}</td><td>${exRow(r[2])}</td></tr>`).join('')}</table>`;
 if(x.chart)body+=`<table class="ltab chart"><tr><th></th><th>${t('live')}</th><th>${t('dead')} (${t('shortV')})</th><th>${t('dead')} (${t('longV')})</th><th class="th">◌่</th><th class="th">◌้</th><th class="th">◌๊</th><th class="th">◌๋</th></tr>
  <tr><td>${t('cls_mid')}</td><td>${tn(0)}</td><td>${tn(1)}</td><td>${tn(1)}</td><td>${tn(1)}</td><td>${tn(2)}</td><td>${tn(3)}</td><td>${tn(4)}</td></tr>
  <tr><td>${t('cls_high')}</td><td>${tn(4)}</td><td>${tn(1)}</td><td>${tn(1)}</td><td>${tn(1)}</td><td>${tn(2)}</td><td>—</td><td>—</td></tr>
  <tr><td>${t('cls_low')}</td><td>${tn(0)}</td><td>${tn(3)}</td><td>${tn(2)}</td><td>${tn(2)}</td><td>${tn(3)}</td><td>—</td><td>—</td></tr></table>`;
 if(x.ex)body+=x.ex.map(([k,rs])=>`<h3 class="vg">${t('lx_'+k)}</h3><div class="lexs">${rs.map(exRow).join('')}</div>`).join('');
 if(x.rule){const s=LBANK.filter(w=>w[3]===x.rule);const by=[0,1,2,3,4].map(tt=>s.filter(w=>w[8]===tt).slice(0,4)).filter(a=>a.length);body+=`<h3 class="vg">${t('moreEx')}</h3>${by.map(a=>`<div class="lexs">${a.map(w=>exRow([w[0],w[1],w[2],w[8]])).join('')}</div>`).join('')}`}
 app().innerHTML=`<div class="top"><button class="btn ghost" onclick="location.hash='lessons'">← ${t('course')}</button>${langSeg()}</div>
 <div class="mute tiny">${t('lessonN',n)}</div><h1 style="margin:2px 0 8px">${esc(x.t[LANG==='zh'?'zh':'en'])}</h1>

 <div class="lbody">${body}</div><div style="height:90px"></div>
 <div class="practice"><button class="btn primary big" onclick="startLQ(${n})">${t('lqStart',10)}${L?` · ${t('best')} ${L.best}%`:''}</button></div>`}
function startLQ(n){const x=LESSONS[n-1];const rnd=Math.random;const qs=[];let guard=0;const seen=new Set();
 while(qs.length<10&&guard++<200){const q=lqGen(x.q[qs.length%x.q.length],rnd);if(!q||seen.has(q.prompt))continue;seen.add(q.prompt);qs.push(q)}
 LQ={n,qs:E.shuffle(qs,rnd),i:0,ok:0,picked:null};location.hash='lq';renderLQ()}
function renderLQ(){if(!LQ){location.hash='lessons';return}
 if(LQ.i>=LQ.qs.length){const pct=Math.round(LQ.ok/LQ.qs.length*100);const L=S.meta.lessons=S.meta.lessons||{};const o=L[LQ.n]||{best:0,n:0};o.n++;o.best=Math.max(o.best,pct);L[LQ.n]=o;markDirty('meta');
  app().innerHTML=`<div class="top"><h1>${t('lessonN',LQ.n)}</h1></div><div class="card" style="text-align:center"><div style="font-size:42px;font-weight:700">${LQ.ok} / ${LQ.qs.length}</div><div class="mute">${t('best')} ${o.best}%</div></div>
  <button class="btn primary big" onclick="startLQ(${LQ.n})">${t('again')}</button><button class="btn big" onclick="location.hash='lesson-${LQ.n}'">${t('backLesson')}</button>${LQ.n<LESSONS.length?`<button class="btn big" onclick="location.hash='lesson-${LQ.n+1}'">${t('nextLesson')} →</button>`:''}`;LQ=null;return}
 const q=LQ.qs[LQ.i];const done=LQ.picked!==null;
 const opt=(o,j)=>{let c='opt';if(done){if(o.k===q.ans)c+=' ok';else if(o.k===LQ.picked)c+=' bad'}return `<button class="${c} ${o.th?'th':''}" ${done?'disabled':''} onclick="pickLQ(${j})"><span class="k">${j+1}</span><span>${o.raw?o.l:esc(o.l)}</span></button>`};
 app().innerHTML=`<div class="top"><button class="btn ghost" onclick="LQ=null;location.hash='lesson-${LQ.n}'">✕</button><span class="mute small">${LQ.i+1} / ${LQ.qs.length}</span></div>
 <div class="mute small">${esc(q.ask)}</div>
 <div class="lqp th" onclick="say('${q.say||q.prompt}')">${esc(q.prompt)} <span class="spk">${ICON_SPK}</span></div>${q.sub?`<div class="mute small" style="text-align:center">${esc(q.sub)}</div>`:''}
 <div class="opts">${q.opts.map(opt).join('')}</div>
 ${done?`<div class="fb ${LQ.picked===q.ans?'ok':'bad'}"><b>${LQ.picked===q.ans?t('right'):t('lqWrong')}</b><div>${q.expRaw?q.exp:esc(q.exp)}</div></div><button class="btn primary big" onclick="LQ.i++;LQ.picked=null;renderLQ()">${t('next')}</button>`:''}`;
 if(!done&&q.say)say(q.say)}
function pickLQ(j){const q=LQ.qs[LQ.i];if(LQ.picked!==null)return;LQ.picked=q.opts[j].k;if(LQ.picked===q.ans)LQ.ok++;logAns(LQ.picked!==q.ans);renderLQ()}

</script>
